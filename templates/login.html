<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logino</title>
<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    min-height:100vh;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;


    color:white;


    background:
    radial-gradient(circle at 15% 10%, rgba(0,180,90,.65), transparent 32%),
    radial-gradient(circle at 85% 20%, rgba(210,40,70,.55), transparent 32%),
    radial-gradient(circle at 50% 100%, rgba(255,255,255,.75), transparent 35%),
    linear-gradient(160deg,#06251b,#0b2545 55%,#eef7f3);


    overflow:hidden;

}



body::before{

    content:"";

    position:fixed;

    inset:0;


    background:rgba(255,255,255,.08);


    backdrop-filter:
    blur(35px)
    saturate(180%);


    pointer-events:none;

}




.container{

    position:relative;

    z-index:1;


    max-width:460px;

    margin:auto;


    padding:100px 22px;


}





/* TARJETA LOGIN */


.card{


    padding:35px;


    border-radius:36px;


    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.30),
        rgba(255,255,255,.08)
    );


    border:
    1px solid
    rgba(255,255,255,.45);



    backdrop-filter:
    blur(30px)
    saturate(200%);



    box-shadow:

    0 35px 90px rgba(0,0,0,.35),

    inset 0 1px rgba(255,255,255,.7);


    animation:
    subir .6s ease;


}


@keyframes subir{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:none;
    }

}




h1{

    margin-top:0;

    font-size:46px;


    letter-spacing:-2px;


    background:
    linear-gradient(
        90deg,
        white,
        #8fffd2,
        white
    );


    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

}




/* INPUTS */


input{


    width:100%;


    padding:15px 18px;


    margin-bottom:16px;


    border-radius:18px;


    outline:none;


    border:
    1px solid
    rgba(255,255,255,.35);



    background:
    rgba(255,255,255,.18);



    color:white;


    font-size:15px;



    backdrop-filter:blur(15px);


}



input::placeholder{

    color:
    rgba(255,255,255,.65);

}



input:focus{

    background:
    rgba(255,255,255,.28);


    box-shadow:
    0 0 30px rgba(0,255,170,.25);

}





/* BOTON ENTRAR */


.btn{

    width:100%;


    padding:15px;


    border-radius:50px;


    border:
    1px solid rgba(255,255,255,.45);



    background:
    linear-gradient(
        135deg,
        rgba(0,200,110,.7),
        rgba(255,255,255,.20),
        rgba(210,40,70,.55)
    );


    color:white;


    font-weight:900;


    font-size:16px;


    cursor:pointer;



    backdrop-filter:blur(20px);



    box-shadow:
    0 18px 45px rgba(0,0,0,.25);


    transition:.25s ease;


}



.btn:hover{

    transform:
    translateY(-3px)
    scale(1.02);


    box-shadow:
    0 30px 70px rgba(0,0,0,.35);

}





/* BOTON REGRESAR */


.back{

    display:inline-block;


    margin-bottom:20px;


    padding:12px 20px;


    border-radius:50px;


    text-decoration:none;


    color:white;


    font-weight:800;



    background:
    rgba(255,255,255,.20);



    border:
    1px solid rgba(255,255,255,.35);



    backdrop-filter:blur(20px);



    box-shadow:
    0 15px 35px rgba(0,0,0,.20);


}





/* ERROR */


.error{


    background:
    rgba(255,70,90,.25);


    border:
    1px solid rgba(255,120,120,.4);


    color:white;


    padding:12px 15px;


    border-radius:18px;


    margin-bottom:18px;


    backdrop-filter:blur(20px);


}





@media(max-width:600px){

.container{

    padding:80px 18px;

}


h1{

    font-size:40px;

}


}

</style>
</head>
<body>
<div class="container">
    <a class="back" href="/">← Inicio</a>

    <div class="card">
        <h1>Login</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button class="btn" type="submit">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
