<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ShivteTV Público</title>
<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; }
.container { max-width:1100px; margin:auto; padding:30px 20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
.card { background:rgba(255,255,255,.08); border-radius:18px; overflow:hidden; }
video { width:100%; height:260px; object-fit:cover; }
.info { padding:14px; }
.btn { background:#334155; color:white; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:bold; display:inline-block; margin-bottom:18px; }
</style>
</head>
<body>
<div class="container">

<a class="btn" href="/actividades/">← Actividades</a>

<h1>📺 ShivteTV</h1>

<div class="grid">
    {% for v in videos %}
        <div class="card">
            <video controls>
                <source src="{{ v.archivo.url }}">
            </video>
            <div class="info">
                <strong>{{ v.pedido.kbutza.nombre }}</strong><br>
                {{ v.pedido.titulo }}
            </div>
        </div>
    {% empty %}
        <p>No hay videos todavía.</p>
    {% endfor %}
</div>

</div>
</body>
</html>
