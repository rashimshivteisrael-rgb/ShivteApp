<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ranking Shevet Bank</title>
<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; }
.container { max-width:900px; margin:auto; padding:30px 20px; }
.card { background:rgba(255,255,255,.08); padding:22px; border-radius:18px; margin-bottom:16px; }
.money { font-size:34px; font-weight:bold; color:#86efac; }
.btn { background:#334155; color:white; padding:10px 14px; border-radius:10px; text-decoration:none; display:inline-block; margin-bottom:16px; }
</style>
</head>
<body>
<div class="container">

<a class="btn" href="/actividades/">← Actividades</a>

<h1>🏆 Ranking Shevet Bank</h1>

{% for item in ranking %}
    <div class="card">
        <h2>
            #{{ forloop.counter }}
            {% if config.grupos_revelados %}
                {{ item.grupo.nombre }}
            {% else %}
                Grupo oculto {{ forloop.counter }}
            {% endif %}
        </h2>

        <div class="money">${{ item.total }}</div>
    </div>
{% empty %}
    <div class="card">No hay grupos todavía.</div>
{% endfor %}

</div>
</body>
</html>
