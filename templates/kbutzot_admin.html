<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kbutzot</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 15% 10%, rgba(0,180,90,.65), transparent 32%),
    radial-gradient(circle at 85% 20%, rgba(210,40,70,.55), transparent 32%),
    radial-gradient(circle at 50% 100%, rgba(255,255,255,.75), transparent 35%),
    linear-gradient(160deg,#06251b,#0b2545 55%,#eef7f3);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(35px) saturate(180%);
    pointer-events:none;
}

.container{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:auto;
    padding:40px 20px 70px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.topbar h1{
    margin:0;

    font-size:46px;

    letter-spacing:-2px;

    background:linear-gradient(
        90deg,
        white,
        #8fffd2,
        white
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.back{
    text-decoration:none;
    color:white;

    padding:12px 18px;

    border-radius:999px;

    font-weight:900;

    border:1px solid rgba(255,255,255,.35);

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 35px rgba(0,0,0,.18);

    transition:.25s ease;
}

.back:hover{
    transform:translateY(-3px);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.item{

    display:block;

    text-decoration:none;
    color:white;

    padding:24px;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.28),
        rgba(255,255,255,.08)
    );

    border:1px solid rgba(255,255,255,.40);

    backdrop-filter:
    blur(28px)
    saturate(200%);

    box-shadow:
    0 25px 55px rgba(0,0,0,.22),
    inset 0 1px rgba(255,255,255,.65);

    transition:.25s ease;
}

.item:hover{

    transform:
    translateY(-7px)
    scale(1.02);

    background:
    linear-gradient(
        145deg,
        rgba(0,200,120,.22),
        rgba(255,255,255,.18),
        rgba(220,40,70,.18)
    );
}

.item strong{
    display:block;
    font-size:22px;
    margin-bottom:10px;
}

.item span{
    color:rgba(255,255,255,.75);
    line-height:1.5;
}

.add-btn{

    position:fixed;

    bottom:25px;
    right:25px;

    width:72px;
    height:72px;

    border-radius:50%;

    font-size:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        135deg,
        rgba(0,200,110,.8),
        rgba(255,255,255,.20),
        rgba(210,40,70,.55)
    );

    border:1px solid rgba(255,255,255,.35);

    backdrop-filter:blur(20px);

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

    transition:.25s ease;
}

.add-btn:hover{

    transform:
    scale(1.08)
    rotate(90deg);
}

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.55);

    backdrop-filter:blur(10px);

    align-items:center;
    justify-content:center;

    z-index:999;
}

.modal-content{

    width:90%;
    max-width:430px;

    padding:28px;

    border-radius:32px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.30),
        rgba(255,255,255,.08)
    );

    border:1px solid rgba(255,255,255,.40);

    backdrop-filter:
    blur(30px)
    saturate(200%);

    box-shadow:
    0 30px 80px rgba(0,0,0,.35);
}

.modal-content h2{
    margin-top:0;
    margin-bottom:20px;
}

input{

    width:100%;

    margin-bottom:14px;

    padding:15px 18px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.18);

    color:white;

    outline:none;

    backdrop-filter:blur(15px);
}

input::placeholder{
    color:rgba(255,255,255,.65);
}

input:focus{
    background:rgba(255,255,255,.25);
    box-shadow:0 0 30px rgba(0,255,170,.18);
}

.save-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:999px;

    cursor:pointer;

    color:white;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        rgba(0,200,110,.75),
        rgba(255,255,255,.20),
        rgba(210,40,70,.50)
    );

    border:1px solid rgba(255,255,255,.35);

    transition:.25s ease;
}

.save-btn:hover{
    transform:translateY(-2px);
}

.close{

    margin-top:14px;

    text-align:center;

    cursor:pointer;

    color:rgba(255,255,255,.7);
}

@media(max-width:700px){

    .container{
        padding:30px 16px 60px;
    }

    .topbar h1{
        font-size:38px;
    }

}

</style>
</head>
<body>

<div class="container">
    <div class="topbar">
        <h1>🏠 Kbutzot</h1>
        <a class="back" href="/panel-admin/">← Panel</a>
    </div>

    <div class="grid">
        {% for k in kbutzot %}
            <a class="item" href="/panel-admin/kbutzot/{{ k.id }}/">
                <strong>{{ k.nombre }}</strong>
                <span>
                    {% if k.madrijim %}
                        {{ k.madrijim|join:", " }}
                    {% else %}
                        Sin madrijim asignados
                    {% endif %}
                </span>
            </a>
        {% empty %}
            <p>No hay kbutzot todavía.</p>
        {% endfor %}
    </div>
</div>

<div class="add-btn" onclick="abrirModal()">+</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2>Agregar Kbutza</h2>

        <form method="POST" action="/panel-admin/kbutzot/">
            {% csrf_token %}
            <input type="text" name="nombre" placeholder="Nombre de la kbutza" required>
            <input type="text" name="cuarto" placeholder="Cuarto">
            <button class="save-btn" type="submit">Guardar</button>
        </form>

        <div class="close" onclick="cerrarModal()">Cancelar</div>
    </div>
</div>

<script>
function abrirModal() {
    document.getElementById('modal').style.display = 'flex';
}

function cerrarModal() {
    document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
