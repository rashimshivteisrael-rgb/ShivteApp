<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar Janij</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 15% 10%, rgba(0,180,90,.65), transparent 32%),
    radial-gradient(circle at 85% 20%, rgba(210,40,70,.55), transparent 32%),
    radial-gradient(circle at 50% 100%, rgba(255,255,255,.75), transparent 35%),
    linear-gradient(160deg,#06251b,#0b2545 55%,#eef7f3);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(35px) saturate(180%);
    pointer-events:none;
}

.container{
    position:relative;
    z-index:1;
    max-width:650px;
    margin:auto;
    padding:40px 20px 60px;
}

.card{

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.30),
        rgba(255,255,255,.08)
    );

    border:1px solid rgba(255,255,255,.40);

    border-radius:34px;

    padding:30px;

    backdrop-filter:
    blur(30px)
    saturate(200%);

    box-shadow:
    0 35px 90px rgba(0,0,0,.30),
    inset 0 1px rgba(255,255,255,.65);
}

h1{

    margin-top:0;
    margin-bottom:24px;

    font-size:42px;

    letter-spacing:-2px;

    background:
    linear-gradient(
        90deg,
        white,
        #8fffd2,
        white
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

input,
textarea,
select{

    width:100%;

    padding:15px 18px;

    margin-bottom:14px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.18);

    color:white;

    font-size:15px;

    outline:none;

    backdrop-filter:blur(20px);

    transition:.2s ease;
}

input:focus,
textarea:focus,
select:focus{

    background:rgba(255,255,255,.26);

    box-shadow:
    0 0 30px rgba(0,255,170,.20);
}

input::placeholder,
textarea::placeholder{
    color:rgba(255,255,255,.65);
}

textarea{
    min-height:120px;
    resize:vertical;
}

select{
    cursor:pointer;
}

option{
    color:black;
}

button,
.btn{

    display:inline-block;

    padding:13px 20px;

    border:none;

    border-radius:999px;

    text-decoration:none;

    font-weight:900;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        rgba(0,200,110,.70),
        rgba(255,255,255,.20),
        rgba(210,40,70,.50)
    );

    border:1px solid rgba(255,255,255,.40);

    backdrop-filter:blur(20px);

    box-shadow:
    0 18px 45px rgba(0,0,0,.22);

    transition:.25s ease;
}

button:hover,
.btn:hover{

    transform:
    translateY(-3px)
    scale(1.03);
}

.back{

    margin-bottom:18px;

    background:
    rgba(255,255,255,.20);
}

@media(max-width:700px){

    .container{
        padding:30px 16px 50px;
    }

    h1{
        font-size:36px;
    }

    .card{
        padding:22px;
    }
}

</style>
</head>
<body>
<div class="container">
    <a class="btn back" href="/janijim/{{ janij.id }}/">← Volver</a>

    <div class="card">
        <h1>Editar janij</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="nombre" value="{{ janij.nombre }}" required>

            <select name="kbutza">
                <option value="">Sin kbutza</option>
                {% for k in kbutzot %}
                    <option value="{{ k.id }}" {% if janij.kbutza and janij.kbutza.id == k.id %}selected{% endif %}>
                        {{ k.nombre }}
                    </option>
                {% endfor %}
            </select>

            <input type="text" name="nombre_mama" value="{{ janij.nombre_mama|default:'' }}" placeholder="Nombre mamá">
            <input type="text" name="tel_mama" value="{{ janij.tel_mama|default:'' }}" placeholder="Tel mamá">

            <input type="text" name="nombre_papa" value="{{ janij.nombre_papa|default:'' }}" placeholder="Nombre papá">
            <input type="text" name="tel_papa" value="{{ janij.tel_papa|default:'' }}" placeholder="Tel papá">

            <textarea name="info_medica" placeholder="Info médica">{{ janij.info_medica|default:'' }}</textarea>

            <button type="submit">Guardar cambios</button>
        </form>
    </div>
</div>
</body>
</html>
